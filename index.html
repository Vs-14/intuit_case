<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autograph for Intuit Enterprise Suite</title>
<meta name="description" content="Clickable prototype: AI agents earn signing authority in Intuit Enterprise Suite. People sign what matters.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --canvas:#F1F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --sunken:#E8EDF4;
  --ink:#0F1D33; --ink-2:#44526A; --ink-3:#6C788F;
  --rule:#DBE2EB; --rule-2:#C4CEDB;
  --act:#1C5BEA; --act-hover:#1449C4; --act-ink:#FFFFFF; --act-soft:#E6EDFD;
  --sign:#1B2A8F;
  --ok:#0A7657; --ok-soft:#E0F2EB;
  --warn:#955700; --warn-soft:#FAEFD9;
  --bad:#B8361F; --bad-soft:#FBE7E2;
  --partner:#5A43C4; --partner-soft:#EDE9FB;
  --scrim:rgba(15,29,51,.45);
  --shadow:0 1px 2px rgba(15,29,51,.05),0 12px 32px rgba(15,29,51,.08);
  --font:"Figtree","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --script:"Mrs Saint Delafield","Brush Script MT","Segoe Script",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0A111D; --surface:#101929; --surface-2:#0D1523; --sunken:#0A1019;
    --ink:#E5EBF4; --ink-2:#A9B5C8; --ink-3:#8290A6;
    --rule:#1F2B40; --rule-2:#2E3D58;
    --act:#5C8DFF; --act-hover:#7CA3FF; --act-ink:#08101C; --act-soft:#16254A;
    --sign:#A9BBFF;
    --ok:#3DC79A; --ok-soft:#0E2A23; --warn:#E6A94A; --warn-soft:#2E220D;
    --bad:#F2846F; --bad-soft:#371914; --partner:#AE9DFF; --partner-soft:#211A42;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0A111D; --surface:#101929; --surface-2:#0D1523; --sunken:#0A1019;
  --ink:#E5EBF4; --ink-2:#A9B5C8; --ink-3:#8290A6;
  --rule:#1F2B40; --rule-2:#2E3D58;
  --act:#5C8DFF; --act-hover:#7CA3FF; --act-ink:#08101C; --act-soft:#16254A;
  --sign:#A9BBFF;
  --ok:#3DC79A; --ok-soft:#0E2A23; --warn:#E6A94A; --warn-soft:#2E220D;
  --bad:#F2846F; --bad-soft:#371914; --partner:#AE9DFF; --partner-soft:#211A42;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--canvas)}
body{height:100%;margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--act)}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
.r{text-align:right}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.xs{font-size:12px}
.strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{height:100%}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:18px 12px 14px}
.brand{padding:2px 10px 12px}
.brand-suite{font-size:12px;color:var(--ink-3)}
.brand-mark{font-family:var(--script);font-size:44px;line-height:1.05;color:var(--sign);margin-top:2px}
.org{margin:0 4px 14px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface-2)}
.org-name{font-weight:600}
.org-sub{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);width:100%}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--act-soft);color:var(--act);font-weight:600}
.nav-l{flex:1}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--act);color:var(--act-ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-3);font-size:13px;width:100%}
.side-link:hover{color:var(--ink);background:var(--surface-2)}
.scrim-nav{display:none}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--surface);min-height:58px}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 28px 80px}
.main:focus{outline:none}
.page{max-width:1160px;margin:0 auto}
.grow{flex:1}
.askbar{display:flex;align-items:center;gap:10px;min-width:0;width:min(420px,40vw);padding:8px 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface-2);color:var(--ink-3)}
.askbar:hover{border-color:var(--act);color:var(--ink-2)}
.askbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--sunken);border:1px solid var(--rule)}
.seg button{padding:6px 12px;border-radius:7px;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,29,51,.14)}
.icon-btn{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.gcount{font-size:12px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.only-m{display:none}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;line-height:20px;border:1px solid transparent;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn-lg{padding:11px 18px;font-size:15px}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-primary{background:var(--act);color:var(--act-ink)}
.btn-primary:hover{background:var(--act-hover)}
.btn-ink{background:var(--sign);color:var(--surface)}
.btn-ink:hover{filter:brightness(1.12)}
.btn-secondary{background:var(--surface);border-color:var(--rule-2);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink-3)}
.btn-quiet{color:var(--act)}
.btn-quiet:hover{background:var(--act-soft)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled,.btn:disabled:hover{background:var(--sunken);color:var(--ink-3);border-color:transparent;filter:none}
.linkbtn{color:var(--act);font-weight:500;text-align:left}
.linkbtn:hover{text-decoration:underline}
.linkbtn.bad{color:var(--bad)}
.linkbtn.strong{font-weight:600;color:var(--ink)}
.linkbtn.strong:hover{color:var(--act)}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ===== Type ===== */
.h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.h2{font-size:16px;line-height:1.3;font-weight:600}
.h3{font-size:15px;line-height:1.3;font-weight:600}
.lede{font-size:15px;color:var(--ink-2);max-width:68ch;margin-top:6px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:22px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;margin-bottom:14px;padding:4px 6px 4px 0}
.back:hover{color:var(--ink)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.sec-h{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}

/* ===== Panels ===== */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.empty{padding:36px 16px;text-align:center}
.empty b{display:block;font-size:15px}
.empty span{color:var(--ink-3);font-size:13px}

/* ===== Tags, chips ===== */
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--rule-2);color:var(--ink-3);white-space:nowrap;line-height:18px}
.tag.partner{border-color:transparent;background:var(--partner-soft);color:var(--partner)}
.tag.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.tag.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.tag.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.tag.ink{border-color:transparent;background:var(--act-soft);color:var(--sign)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--rule-2);font-size:13px;color:var(--ink-2);background:var(--surface)}
.chip:hover{border-color:var(--act);color:var(--act)}
.agent{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);min-width:0}
.agent-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;background:var(--act-soft);color:var(--act);flex:none;letter-spacing:.02em}
.av.p{background:var(--partner-soft);color:var(--partner)}
.av.h{background:var(--sunken);color:var(--ink-2);border-radius:50%}
.av.lg{width:36px;height:36px;border-radius:9px;font-size:13px}
.av.h.lg{border-radius:50%}

/* ===== Checks ===== */
.ck{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ck.pass{background:var(--ok-soft);color:var(--ok)}
.ck.fail{background:var(--bad-soft);color:var(--bad)}
.ck.warn{background:var(--warn-soft);color:var(--warn)}
.ck.info{background:var(--act-soft);color:var(--act)}
.ck.ink{background:var(--act-soft);color:var(--sign)}
.cs{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.cs.bad{color:var(--bad);font-weight:600}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.checks li:first-child{border-top:0;padding-top:2px}
.checks .ck{margin-top:1px}
.ck-t{font-weight:600;color:var(--ink)}
.ck-d{color:var(--ink-3)}
.ck-by{color:var(--partner);font-size:12px;font-weight:600}
.checks li.fresh{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--act-soft)}100%{background:transparent}}

/* ===== Home brief ===== */
.brief{padding:4px 0 26px}
.brief-date{color:var(--ink-3);font-size:13px}
.brief-h{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.brief-lede{font-size:19px;line-height:1.45;color:var(--ink-2);max-width:60ch;margin-top:10px}
.brief-lede b{color:var(--ink);font-weight:600}
.brief-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule);margin-bottom:26px}
.metric{padding:14px 18px 16px 0;min-width:0}
.metric + .metric{padding-left:18px;border-left:1px solid var(--rule)}
.m-label{font-size:13px;color:var(--ink-3)}
.m-val{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.m-sub{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.ebars{display:flex;gap:6px;align-items:flex-end}
.ebar{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3)}
.ebar i{display:block;width:26px;height:6px;border-radius:3px;background:var(--sunken);position:relative;overflow:hidden}
.ebar i b{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.feed li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.feed li:first-child{border-top:0;padding-top:4px}
.f-time{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.f-body .who{font-weight:600}
.f-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.feed li.new{animation:flash 2.2s ease}
.callout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.callout p{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.callout .btn{margin-top:10px}
.insight{padding:12px 0;border-top:1px solid var(--rule)}
.insight:first-of-type{border-top:0;padding-top:2px}
.insight p{color:var(--ink-2);font-size:13.5px;margin-top:2px}

/* ===== Banners ===== */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-radius:12px;margin-bottom:18px;border:1px solid var(--rule)}
.banner.warn{background:var(--bad-soft);border-color:transparent}
.banner.info{background:var(--act-soft);border-color:transparent}
.banner p{font-size:13.5px}

/* ===== Queue ===== */
.qtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto}
.qtab{padding:10px 12px;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.qtab.on{color:var(--ink);border-bottom-color:var(--ink)}
.qn{font-weight:500;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.qlist{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.qhead,.qrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px 168px 150px;gap:16px;align-items:center}
.qhead{font-size:12px;color:var(--ink-3);padding:10px 16px 8px 20px;background:var(--surface-2)}
.qrow{position:relative;width:100%;padding:14px 16px 14px 20px;border-top:1px solid var(--rule);background:var(--surface)}
.qrow:hover{background:var(--surface-2)}
.qrow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;background:var(--rule-2)}
.qrow.r-high::before{background:var(--bad)}
.qrow.r-med::before{background:var(--warn)}
.qrow.r-low::before{background:var(--ok)}
.q-main{min-width:0}
.q-id{display:block;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.q-title{display:block;font-weight:600;font-size:15px;margin-top:1px}
.q-why{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.q-ent{font-size:13px;color:var(--ink-2)}
.q-amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 130px 168px 90px;gap:16px;align-items:center;padding:14px 16px 14px 20px;border-top:1px solid var(--rule)}
.prow:first-child{border-top:0}

/* ===== Proposal sheet ===== */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:22px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;padding:26px 30px 30px;box-shadow:var(--shadow)}
.sheet-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.sheet-h{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin-top:12px}
.sheet-sum{color:var(--ink-2);margin-top:6px;max-width:70ch;font-size:15px}
.sec{margin-top:26px}
.tbl{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.ledger td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.ledger td.r,.ledger th.r{text-align:right;white-space:nowrap}
.ledger tr.grp td{background:var(--surface-2);font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 10px}
.ledger tr.add td:first-child{box-shadow:inset 3px 0 var(--ok)}
.ledger tr.on td{background:var(--act-soft)}
.old{color:var(--ink-3);text-decoration:line-through;margin-right:8px;font-weight:400}
.new{color:var(--ok);font-weight:600}
.note{font-size:13px;color:var(--ink-3);margin-top:8px}
.reason{font-size:15px;line-height:1.65;max-width:72ch}
.ref{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--act-soft);color:var(--act);font-size:11px;font-weight:700;vertical-align:1px;margin:0 1px;line-height:1}
.ev{display:grid;gap:8px}
.ev li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;transition:background-color .3s,border-color .3s}
.ev li.hl{border-color:var(--act);background:var(--act-soft)}
.ev li.fresh{animation:flash 1.8s ease}
.ev-n{font-weight:700;color:var(--act);font-size:12px;padding-top:2px}
.ev-t{font-weight:600}
.ev-q{font-size:13px;color:var(--ink-2)}
.plain li{padding:6px 0 6px 18px;position:relative}
.plain li::before{content:"";position:absolute;left:4px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.sigblock{margin-top:30px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.sig{min-width:250px;flex:0 1 320px}
.sig-ink{height:58px;display:flex;align-items:flex-end;font-family:var(--script);font-size:48px;line-height:.9;color:var(--sign);padding-left:8px;white-space:nowrap}
.sig-ink.write{animation:write 1.4s cubic-bezier(.45,.1,.2,1) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.sig-line{border-top:1.5px solid var(--ink)}
.sig-cap{font-size:12px;color:var(--ink-3);margin-top:6px}
.sig-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);font-weight:500}
.sig-note.muted{color:var(--ink-3);font-weight:400}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.rail .panel{padding:16px 18px}
.conf{display:flex;align-items:baseline;gap:8px}
.conf-v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.meter{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;margin:8px 0 8px}
.meter i{display:block;height:100%;background:var(--act);border-radius:3px;transition:width .7s ease}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{width:100%}
.reviewed{display:flex;gap:10px;align-items:center;font-size:13px}
.thread{margin-top:18px}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--rule)}
.msg:first-child{border-top:0}
.msg .av{width:28px;height:28px}
.msg-who{font-weight:600;font-size:13px}
.msg-who span{font-weight:400;color:var(--ink-3);margin-left:6px}
.msg-b{margin-top:2px;white-space:pre-wrap;max-width:72ch}
.steps{display:grid;gap:7px;margin-top:8px}
.steps li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink-3)}
.steps li.done{color:var(--ink-2)}
.steps li .ck{margin-top:1px}
.steps li.todo{opacity:.55}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule-2);border-top-color:var(--act);animation:spin .8s linear infinite;flex:none;margin-top:1px}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{display:flex;gap:8px;margin-top:12px}
.input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface);color:var(--ink)}
.input:focus{outline:2px solid var(--act);outline-offset:0;border-color:transparent}
.ta{width:100%;resize:vertical;line-height:1.5;display:block}

/* ===== Trust lines ===== */
.promo{border:1px solid var(--rule-2);border-radius:14px;background:var(--surface);padding:20px 22px;margin-bottom:22px;box-shadow:var(--shadow)}
.promo-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin-top:14px}
.promo h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.ticks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;padding:5px 0;font-size:13.5px}
.ticks .ck{margin-top:1px}
.tlist{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px 20px}
.tlrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:center;padding:16px 0;border-top:1px solid var(--rule)}
.tlrow:first-child{border-top:0}
.tl-task{font-weight:600;margin-top:4px}
.tl-lbl{font-weight:600;font-size:13.5px;margin-bottom:2px}
.tl{position:relative;height:34px}
.tl-track{position:absolute;left:0;right:0;top:11px;border-top:1px dashed var(--rule-2)}
.tl-fill{position:absolute;left:0;top:10px;height:3px;border-radius:2px;background:var(--sign);transition:width 1s cubic-bezier(.3,.1,.2,1)}
.tl-cap{position:absolute;top:10px;height:3px;background-image:repeating-linear-gradient(90deg,var(--ok) 0 5px,transparent 5px 9px)}
.tl-nib{position:absolute;top:5px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2.5px solid var(--sign);transition:left 1s cubic-bezier(.3,.1,.2,1)}
.tl-nib.none{border-color:var(--rule-2)}
.tl-lab{position:absolute;top:20px;font-size:11px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.tl-lab.end{transform:translateX(-100%)}
.tl-rec{font-size:13px;color:var(--ink-2)}
.tl-rec span{display:block;color:var(--ink-3);font-size:12.5px}
.human li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.human li:first-child{border-top:0}
.human .i{color:var(--ink-3);margin-top:2px}
.human span{display:block;color:var(--ink-3);font-size:12.5px}

/* ===== Close ===== */
.closeprog{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.cp-num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:84px}
.cp-bar{flex:1;height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.cp-bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .8s ease}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lane{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 14px 6px}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane-bar{height:4px;background:var(--sunken);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.lane-bar i{display:block;height:100%;background:var(--ok);transition:width .8s ease}
.task{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.task:first-child{border-top:0}
.task .ck{margin-top:1px}
.task-n{font-weight:500}
.task-m{color:var(--ink-3);font-size:12px}
.task .linkbtn{font-size:12.5px}
.lockbox{text-align:right}
.chart .bar{fill:var(--rule-2)}
.chart .bar-hi{fill:var(--act)}
.chart .bar-neg{fill:var(--bad)}
.chart .bar-tot{fill:var(--ink-3)}
.chart .bar-now{fill:var(--sign)}
.chart .ax{font-size:10.5px;fill:var(--ink-3);font-family:var(--font)}
.chart .bv{font-size:10.5px;fill:var(--ink-2);font-weight:600;font-family:var(--font)}
.chart .tgt{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1.5}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .conn{stroke:var(--ink-3);stroke-dasharray:2 3;stroke-width:1}
.spk{stroke:var(--act);stroke-width:1.6;fill:none}

/* ===== Explain ===== */
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.xgrid .stack .panel{padding:16px 18px}
.xnum{display:inline-flex;align-items:baseline;gap:10px;padding:3px 6px;margin:-3px -6px;border-radius:7px;font-variant-numeric:tabular-nums}
.xnum .xv{font-weight:600;border-bottom:1.5px dotted var(--ink-3)}
.xnum:hover{background:var(--act-soft)}
.xnum:hover .xv{border-bottom-color:var(--act)}
.xnum.on{background:var(--act-soft)}
.xnum.on .xv{color:var(--act);border-bottom-color:var(--act)}
.xd{font-size:12px;font-weight:500}
.xd.neg{color:var(--bad)}
.xd.pos{color:var(--ok)}
.glance td{padding:10px 10px}
.glance td:first-child{padding-left:0}
.glance td:last-child{padding-right:0}
.xpanel{min-height:300px}
.xq{font-size:18px;font-weight:600;line-height:1.35}
.xp-text{font-size:15px;line-height:1.65;margin-top:10px;min-height:3em}
.caret::after{content:"";display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--act);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lineage li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.lineage li:first-child{border-top:0}
.lin-pts{font-weight:700;font-variant-numeric:tabular-nums;color:var(--bad);min-width:46px}
.lineage p{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.dep{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13px;margin-top:14px}
.dep.ok{background:var(--ok-soft)}
.dep .ck{margin-top:1px}

/* ===== Branches ===== */
.brgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.brlist li{padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.brlist li:first-child{border-top:0;padding-top:2px}
.brlist b{display:block;font-weight:600}
.brlist span{color:var(--ink-3);font-size:12.5px}
.brlist .on b{color:var(--act)}
.cmp td:nth-child(n+2){text-align:right;white-space:nowrap}
.cmp th:nth-child(n+2){text-align:right}
.cmp .pos{color:var(--ok);font-weight:600}
.cmp .neg{color:var(--bad);font-weight:600}

/* ===== Exchange ===== */
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.xcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.xcard.feat{border-color:var(--act);box-shadow:0 0 0 3px var(--act-soft)}
.xc-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.xc-badges{display:flex;gap:6px;flex-wrap:wrap}
.xc-d{color:var(--ink-2);font-size:13.5px}
.xc-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px;border-top:1px solid var(--rule)}
.xc-facts dt{font-size:12px;color:var(--ink-3)}
.xc-facts dd{font-size:13px;font-weight:500}
.xc-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* ===== Modal ===== */
.modal-root{position:fixed;inset:0;display:none;z-index:60}
.modal-root.open{display:block}
.modal-scrim{position:absolute;inset:0;background:var(--scrim)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100% - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px 22px;animation:pop .2s ease}
.modal.wide{width:min(820px,calc(100% - 24px))}
.modal:focus{outline:none}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
.m-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.m-h p{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule-2);border-radius:12px;width:100%;background:var(--surface)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--act);box-shadow:0 0 0 3px var(--act-soft)}
.opt-b{display:flex;flex-direction:column;min-width:0}
.opt-b span{font-size:13px;color:var(--ink-2)}
.bbox{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule)}
.bbox p{font-size:13.5px;margin-top:6px}
.bbox p:first-child{margin-top:0}
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.sum{padding:12px;border:1px solid var(--rule);border-radius:10px}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--ink-3)}
.perm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.perm h3{font-size:13px;font-weight:600;margin-bottom:6px}
.perm li{font-size:13px;color:var(--ink-2);padding:3px 0}
.welcome .wm{font-family:var(--script);font-weight:400;font-size:64px;line-height:1;color:var(--sign);margin-top:4px}
.w-lede{font-size:19px;font-weight:600;margin:8px 0 14px}
.welcome p{max-width:60ch}
.welcome p + p{margin-top:8px}

/* ===== How it works ===== */
.how{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:6px}
.how-box{border:1px solid var(--rule-2);border-radius:10px;padding:10px 14px;background:var(--surface)}
.how-box b{display:block;font-size:14px}
.how-box span{font-size:13px;color:var(--ink-2)}
.how-box.ok{border-color:transparent;background:var(--ok-soft)}
.how-box.ink{border-color:transparent;background:var(--act-soft)}
.how-arrow{align-self:center;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ink-3);padding:3px 0}
.how-arrow::before{content:"";width:1px;height:10px;background:var(--rule-2)}
.how-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts li{padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.facts li:first-child{border-top:0}
.facts span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

/* ===== Drawers ===== */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow);transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 12px 18px;border-bottom:1px solid var(--rule)}
.dr-b{flex:1;overflow-y:auto;padding:14px 18px}
.dr-f{padding:12px 18px;border-top:1px solid var(--rule)}
.gbar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
.glist{counter-reset:g}
.gi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--rule);counter-increment:g}
.gi:first-child{border-top:0}
.gi-n{width:22px;height:22px;border-radius:50%;border:1px solid var(--rule-2);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.gi-n::before{content:counter(g)}
.gi.done .gi-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gi.done .gi-n::before{content:none}
.gi-b b{display:block;font-size:13.5px}
.gi-b span{display:block;font-size:12.5px;color:var(--ink-3)}
.gsec{font-size:12.5px;color:var(--ink-3);margin:16px 0 2px;font-weight:600}
.amsg{padding:12px 0;border-top:1px solid var(--rule)}
.amsg:first-child{border-top:0;padding-top:2px}
.amsg-who{font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.amsg.you .amsg-t{font-weight:600}
.amsg-t{margin-top:3px;white-space:pre-wrap;font-size:14px}
.thinking{color:var(--ink-3)}
.thinking::after{content:"...";display:inline-block;animation:blink 1.2s steps(1) infinite}

/* ===== Developer ===== */
.journey{margin-bottom:22px}
.jsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:8px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--surface)}
.jsteps li + li{border-left:1px solid var(--rule)}
.jsteps button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;min-width:0}
.jsteps button:hover{background:var(--surface-2)}
.jn{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-3);flex:none}
.jsteps b{display:block;font-size:13.5px}
.jd{display:block;font-size:12px;color:var(--ink-3)}
.jsteps li.on{background:var(--act-soft)}
.jsteps li.on .jn{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.jsteps li.past .jn{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.sgrid .ledger th:first-child,.sgrid .ledger td:first-child{padding-left:18px}
.sgrid .ledger th:last-child,.sgrid .ledger td:last-child{padding-right:18px}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);padding:0 10px}
.tab{padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.code{margin:0;padding:16px 18px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre;min-height:260px;color:var(--ink);background:var(--surface-2);border-radius:0 0 14px 14px}
.code .k{color:var(--act)}
.code .s{color:var(--ok)}
.code .c{color:var(--ink-3);font-style:italic}
.code .w{color:var(--partner)}
.tools li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:11px 18px;border-top:1px solid var(--rule);font-size:13.5px}
.tools li:first-child{border-top:0}
.tools code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;color:var(--act);font-weight:600}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:13px}
.kv div:first-child{border-top:0;padding-top:2px}
.kv dt{color:var(--ink-3)}
.kv dd{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.twins li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.twins li:first-child{border-top:0;padding-top:2px}
.twins .ck{margin-top:2px}
.gates td{vertical-align:middle}
.diffline{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--surface-2);margin-top:10px;overflow-x:auto;white-space:pre}
.diffline .del{color:var(--bad)}
.diffline .add{color:var(--ok)}
.pubgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.popt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--rule-2);border-radius:12px;width:100%;margin-top:8px}
.popt .dotr{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule-2);margin-top:2px}
.popt.on{border-color:var(--act);box-shadow:0 0 0 3px var(--act-soft)}
.popt.on .dotr{border:5px solid var(--act)}
.popt b{display:block}
.popt span{font-size:13px;color:var(--ink-2)}
.switch{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:12px 0 2px}
.sw{width:38px;height:22px;border-radius:11px;background:var(--rule-2);position:relative;transition:background-color .2s;margin-top:1px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-pressed="true"] .sw{background:var(--ok)}
.switch[aria-pressed="true"] .sw::after{left:19px}
.switch span{font-size:13.5px;color:var(--ink-2)}
.kvs div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:13.5px}
.kvs div:first-child{margin-top:12px}
.kvs b{font-weight:600;text-align:right}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 8px}
.mix i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ===== Toasts ===== */
.toasts{position:fixed;right:16px;bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none;align-items:flex-end}
.toast{pointer-events:auto;background:var(--ink);color:var(--canvas);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:min(440px,calc(100vw - 32px));display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
.toast .i{margin-top:2px;color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .pgrid,.bgrid,.pubgrid{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qhead,.qrow{grid-template-columns:minmax(0,1fr) 70px 120px 150px}
  .q-checks{display:none}
  .qhead span:last-child{display:none}
}
@media (max-width:900px){

function hl(src, lang) {
  const e = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (lang === 'yaml') return e.split('\n').map(line => {
    let code = line, com = '';
    const ci = line.indexOf('#');
    if (ci >= 0) { code = line.slice(0, ci); com = line.slice(ci); }
    code = code.replace(/("[^"]*")/g, '<span class="s">$1</span>').replace(/^(\s*-?\s*)([\w.]+)(:)/, '$1<span class="k">$2</span>$3');
    return code + (com ? `<span class="c">${com}</span>` : '');
  }).join('\n');
  return e.replace(/(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|`[^`]*`)|\b(import|from|export|default|async|await|const|for|of|if|continue|return)\b/g, (m, c, s, k) => c ? `<span class="c">${c}</span>` : s ? `<span class="s">${s}</span>` : `<span class="k">${k}</span>`);
}

    ukMarginDrivers: 'August 41.3% to September 38.2%: Northsea Line freight surcharge −1.9 pts (£18,550 on £976,300 of sales, from accrual ACR-2207), channel mix −0.8 pts (wholesale 46% of UK sales vs 39%), exchange rate −0.4 pts (GBP/USD 1.3600 to 1.3410)',
    cash: '$14.2M across entities. 13-week forecast low of $11.8M in the week of November 16, from the holiday inventory build. Wholesale collection days rose from 38 to 47',
    indiaGST: S.gst.installed ? 'GSTMatch (partner agent from LedgerLoop) installed with drafts only. GST-0131 holds 118 matches worth ₹16.4 lakh of input credit' : '143 purchase bills don’t match suppliers’ GSTR-2B filings; ₹21.6 lakh of input credit at risk; no installed agent can fix it. GSTMatch in the Agent Exchange can, with a free trial on a branch',
    branches: S.branch.status && S.branch.status !== 'running' ? 'plan/fy27-bengaluru: moving 20 planned 2027 hires from Denver to Bengaluru cuts their annual cost from $4.06M to $0.86M; 2027 EBITDA $9.8M to $11.5M; lowest cash $6.1M to $6.9M; effective tax rate 24.1% to 24.6%; one check flagged by Kessler & Co. on how work is directed across borders' + (S.branch.status === 'merged' ? '. Merged into FY27 plan v3' : '') : 'No branches created today',
    people: 'Maya Okafor (CFO), Leo Park (controller), Sarah Kessler CPA (Kessler & Co., the company’s accounting firm), Rahul Iyer CA (Intuit Expert, India transfer pricing)'
  };
}
function buildTurns(q) {
  const who = S.persona === 'cfo' ? 'Maya Okafor, CFO of Ridgeline Outdoor Co.' : 'Riya Nair, a developer building agents for the IES Agent Exchange';
  const rules = `You are Autograph, the AI layer in Intuit Enterprise Suite, inside a clickable product prototype. You are answering ${who}. Everything below is fictional demo data. Answer only from it. If the answer is not in the data, say so in one sentence and point to the screen where she would look. Keep answers under 110 words, in plain sentences, with no markdown formatting. When you mention a change that needs a signature, include its ID.\n\nDATA (JSON):\n${JSON.stringify(aiData())}`;
  const hist = S.ask.msgs.slice(0, -2).filter(m => m.text && (m.who === 'you' || m.done)).slice(-6).map(m => ({ role: m.who === 'you' ? 'user' : 'assistant', content: m.text }));
  return [{ role: 'user', content: rules }, ...hist, { role: 'user', content: q }];
}
function scripted(q) {
  const s = q.toLowerCase();
  if (S.persona === 'dev') {
    if (/pay|price|money|earn|fee|share/.test(s)) return 'You set a price per outcome, such as $0.12 per matched invoice. Customers pay on their Intuit bill and you keep 85%. You’re paid only for outcomes a customer signed, never for reads or API calls. If you opt into Intuit Assurance, customers pay 3% more, which funds the cover.';
    if (/change|write|scope|access|permission|can my/.test(s)) return 'Nothing directly. Your agent reads within the scopes a customer grants at install and submits proposals. The customer’s checks run on each one, and it posts only when a person signs, or when it falls within the trust line your agent earned at that company.';
    if (/authority|trust|line|autonom/.test(s)) return 'Every agent starts with drafts only at each new customer. Your record elsewhere can fast-track it: GSTMatch earns a ₹50,000 line after 30 signed drafts because 98.7% of its work is signed without edits across 212 companies. Lines drop automatically if that rate falls.';
    return 'In this demo I can explain pricing, what your agent can change, how it earns authority, and how testing on twin companies works. Try “How do I get paid?”';
  }
  if (/sign|need|attention|pending|today|queue|waiting/.test(s)) {
    const p = pending().sort((a, b) => RISK[a.risk] - RISK[b.risk]);
    if (!p.length) return 'Nothing needs your signature right now. Agents will bring new changes to Sign-off as they find them.';
    const out = [`${p.length} ${p.length === 1 ? 'change needs' : 'changes need'} your signature. Start with ${p.slice(0, 3).map(x => `${x.id} (${x.amt})`).join(', ')}.`];
    if (!decided('IC-0931')) out.push(S.ic.v === 2 ? 'IC-0931 now passes its policy check after revision 2.' : 'IC-0931 has a failing check: the contract says an 8% markup, your policy says 15%.');
    if (!decided('AP-5521')) out.push('AP-5521 is a bank-change request that looks like fraud, so reject it unless Summit confirms by phone.');
    return out.join(' ');
  }
  if (/margin|uk|gross/.test(s)) return 'UK gross margin fell from 41.3% to 38.2%. Northsea Line’s peak-season freight surcharge explains 1.9 points, more wholesale sales explain 0.8, and a weaker pound on stock bought in dollars explains 0.4. The freight part relies on ACR-2207' + (decided('ACR-2207') ? ', which is now decided.' : ', which isn’t signed yet.');
  if (/close|block|lock/.test(s)) { const cs = closeStats(); return `September’s close is ${cs.pct}% done, ${cs.done} of ${cs.total} tasks. ` + (S.gst.installed ? (decided('GST-0131') ? 'India’s GST blocker is cleared. ' : 'India’s GST blocker needs one signature, on GST-0131. ') : 'India is blocked: 143 purchase bills don’t match suppliers’ GST filings, and none of your agents can fix it. GSTMatch in the Agent Exchange can. ') + (cs.done === cs.total ? 'Everything is signed, so you can lock September.' : 'The rest are signatures waiting in Sign-off.'); }
  if (/cash|runway|liquid/.test(s)) return 'Cash across the four entities is $14.2M. The 13-week forecast bottoms out at $11.8M in the week of November 16, when the holiday inventory build peaks. Wholesale customers are paying slower: collection days rose from 38 to 47.';
  if (/agent|authority|trust|line|autonom/.test(s)) return `Five agents sign on their own within trust lines, from CA$5,000 for PayoutSync to $50,000 for FX revaluation. The Accounting Agent ${S.promoted ? 'now signs bank matches up to $10,000.' : 'is ready to go from $2,500 to $10,000 on bank matches: 99.6% of its last 1,812 were signed without edits.'} The Payroll and Intercompany agents still draft only, and six kinds of change always need a person.`;
  if (/gst|india|credit/.test(s)) return S.gst.installed ? 'GSTMatch is installed with drafts only. Its 118 matches, worth ₹16.4 lakh of input credit, are in GST-0131' + (decided('GST-0131') ? ', which you’ve decided.' : ', waiting for your signature.') : '143 purchase bills in India don’t match what suppliers filed, so ₹21.6 lakh of input credit is at risk and India’s close is blocked. GSTMatch in the Agent Exchange can fix it, and you can try it free on a branch first.';
  if (/intercompany|ic-0931|markup|transfer/.test(s)) return S.signed['IC-0931'] ? 'IC-0931 is signed and posted at cost plus 15%, with Amendment No. 2 drafted for both boards.' : S.ic.v === 2 ? 'IC-0931 now charges cost plus 15% per your 2026 policy: $1,225,624. The policy check passes. Amendment No. 2 still needs both boards to sign.' : 'IC-0931 charges the US for India’s July to September engineering at cost plus 8%, from the 2023 agreement. Your 2026 policy says 15%, so the policy check fails. Ask the agent to use 15%, or get an expert opinion.';
  if (/hire|bengaluru|branch|plan/.test(s)) return S.branch.status === 'done' || S.branch.status === 'merged' ? 'On the branch, moving 20 hires to Bengaluru cuts their annual cost from $4.06M to $0.86M and lifts 2027 EBITDA by $1.7M. One check needs a look: how work is directed across borders.' : 'You haven’t created a branch today. In Branches, try moving 20 of next year’s hires to Bengaluru.';
  return 'In this demo I can answer questions about Ridgeline’s September: what needs your signature, margins, cash, the close, agent authority, intercompany charges or India GST.';
}
async function typeAnswer(m, text, gen) {
  if (RM) { m.text = text; return updateLastAsk(m); }
  const words = text.split(' ');
  for (let i = 1; i <= words.length; i++) {
    if (gen !== GEN) return;
    m.text = words.slice(0, i).join(' '); updateLastAsk(m);
    await sleep(20);
  }
}
function updateLastAsk(m) {
  const els = $$('#ask-log .amsg.ai'); const el = els[els.length - 1]; if (!el) return;
  const t = $('.amsg-t', el); if (t) t.textContent = m.text;
  const log = $('#ask-log'); if (log) log.scrollTop = log.scrollHeight;
}
async function ask(q) {
  q = String(q || '').trim(); if (!q || S.ask.busy) return;
  const gen = GEN;
  S.ask.busy = true;
  S.ask.msgs.push({ who: 'you', text: q });
  const m = { who: 'ai', text: '', pending: true, done: false, live: false };
  S.ask.msgs.push(m);
  const inp = $('#ask-in'); if (inp) inp.value = '';
  renderAsk();
  let ok = false;
  if (SAMPLE && !SAMPLE_OFF) {
    try {
      const res = await SAMPLE(buildTurns(q), { modelTier: 'quick', cache: false, onText: ({ text }) => { if (gen !== GEN) return; m.pending = false; m.text = text; updateLastAsk(m); } });
      if (gen !== GEN) return;
      m.text = res.text; m.live = true; ok = true;
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].indexOf(code) >= 0) SAMPLE_OFF = true;
      if (e && e.text && code !== 'refused') { m.text = e.text; m.live = true; ok = true; }
    }
  }
  if (gen !== GEN) return;
  if (!ok) { m.pending = false; m.live = false; await typeAnswer(m, scripted(q), gen); if (gen !== GEN) return; }
  m.pending = false; m.done = true; S.ask.busy = false;
  renderAsk();
}
async function detectSample() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const s = await window.claude.use('sample');
      if (s) { SAMPLE = s; const el = $('#ask-mode'); if (el) el.textContent = askModeText(); }
    }
  } catch (e) { SAMPLE = null; }
}

/* ---------- theme ---------- */
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
function currentTheme() { return document.documentElement.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }

/* ---------- actions ---------- */
const A = {
  go: v => go(v),
  persona: p => { if (S.persona === p) return; S.persona = p; closeDrawers(); go(p === 'cfo' ? 'home' : 'signals'); },
  goQueueTab: t => { S.queueTab = t; go('queue'); },
  qtab: t => { S.queueTab = t; renderMain(true); },
  open: id => { S.sel = id; go('proposal'); },
  sign: id => doSign(id),
  reject: id => {
    if (!prop(id) || decided(id)) return;
    S.rejected[id] = true; renderChrome(); renderMain(true);
    toast(`${id} rejected. Nothing was posted, and it counts against the agent’s record.`);
  },
  vendorReject: () => {
    if (decided('AP-5521')) return;
    S.rejected['AP-5521'] = true; renderChrome(); renderMain(true);
    toast('Change rejected. Summit Freight’s payments go to the verified account.');
  },
  vendorVerify: () => { S.vendorVerified = true; renderMain(true); toast('Call recorded. Bank changes still need a second person to sign.'); },
  toComposer: () => { const c = $('#ic-composer'); if (c) { c.scrollIntoView({ block: 'center', behavior: RM ? 'auto' : 'smooth' }); const i = $('#ic-in'); if (i) setTimeout(() => i.focus({ preventScroll: true }), 350); } },
  icSend: () => { const i = $('#ic-in'); if (i) { const v = i.value; i.value = ''; icRevise(v); } },
  icChip: t => icRevise(t),
  expertOpen: () => { if (!S.ic.expert) openModal(expertModal()); },
  expertPick: w => { S.ic.expertWho = w; openModal(expertModal()); },
  expertSend: () => expertSend(),
  promote: () => {
    if (S.promoted) return;
    S.promoted = true; S.acctLine = 10000; S.promotedAt = now();
    const row = $('[data-row="acct"]'), pct = tlPct(10000).toFixed(2) + '%';
    if (row) {
      const f = $('.tl-fill', row), nib = $('.tl-nib', row), cap = $('.tl-cap', row), lbl = $('.tl-lbl', row);
      if (f) f.style.width = pct;
      if (nib) nib.style.left = pct;
      if (cap) { cap.style.transition = 'opacity .6s'; cap.style.opacity = '0'; }
      if (lbl) lbl.textContent = 'Signs up to $10,000 per match';
      row.scrollIntoView({ block: 'center', behavior: RM ? 'auto' : 'smooth' });
    }
    markDone('authority'); renderChrome();
    toast('Accounting Agent now signs bank matches up to $10,000. Leo Park reviews a 5% sample each week.');
    const gen = GEN;
    setTimeout(() => { if (gen === GEN) refreshIfOn('authority'); }, 1500);
  },
  notNow: () => toast('The Accounting Agent keeps its $2,500 line. Autograph will ask again next month.'),
  explain: k => { if (!EXPLAIN[k]) return; S.xsel = k; renderMain(true); },
  explainGo: k => { S.xsel = k; go('explain'); },
  branchRun: () => branchRun(),
  branchMerge: () => { S.branch.status = 'merged'; renderMain(true); toast('Merged into the FY27 plan as version 3. Actuals never change from a branch.'); },
  branchAsk: () => toast('Sent to Sarah Kessler at Kessler &amp; Co., with the branch attached.'),
  gstFind: () => { S.exch.ctx = true; go('exchange'); },
  exAll: () => { S.exch.ctx = false; renderMain(true); },
  gstTrial: () => gstTrial(),
  gstResults: () => openModal(trialModal(), true),
  gstInstall: () => openModal(installModal(), true),
  gstConfirm: () => {
    if (S.gst.installed) return closeModal();
    S.gst.installed = true; S.gst.at = now();
    if (!prop('GST-0131')) S.props.push(Object.assign({}, GST_PROP));
    closeModal(); markDone('exchange');
    renderChrome(); renderMain(true);
    toast('GSTMatch installed with drafts only. Its 118 matches are waiting in Sign-off.');
  },
  gstDiscard: () => { closeModal(); S.gst.trial = null; refreshIfOn('exchange'); toast('Branch discarded. Nothing changed in your books.'); },
  soon: () => toast('In this demo, the free branch trial is wired up for GSTMatch.'),
  undo: id => toast(`Reversal of ${id} drafted. It posts when someone signs it.`),
  lock: () => {
    const cs = closeStats(); if (S.locked || cs.done < cs.total) return;
    S.locked = true; renderMain(true);
    toast('September is locked for all 4 entities. Signed by Maya Okafor.');
  },
  ev: n => {
    $$('.ev li.hl').forEach(x => x.classList.remove('hl'));
    const li = $('#ev-' + n);
    if (li) { li.classList.add('hl'); li.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' }); }
  },
  sig: id => { S.dev.sig = id; renderMain(true); },
  devGen: () => devGen(),
  devTab: t => { S.dev.tab = t; renderMain(true); },
  devEval: () => { if (!S.dev.evalBusy && S.dev.evalRun === 0 && S.dev.gen) runEval(['Running on Kaveri Components, 3,100 bills', 'Running on Nilgiri Software Services, 1,450 bills', 'Running on Coastal Threads, 2,300 bills', 'Repeating every run 8 times to check consistency', 'Running red-team tests'], 1); },
  devFix: () => { if (!S.dev.evalBusy && S.dev.evalRun === 1) runEval(['Applying the fix: normalizing invoice numbers', 'Running again on all 3 twins', 'Repeating every run 8 times', 'Running red-team tests'], 2); },
  devPublish: () => devPublish(),
  devPrice: k => { S.dev.price = k; renderMain(true); },
  devAssure: () => { S.dev.assured = !S.dev.assured; renderMain(true); },
  askOpen: () => openDrawer('ask'),
  askSend: () => { const i = $('#ask-in'); if (i) ask(i.value); },
  askChip: q => ask(q),
  guideOpen: () => openDrawer('guide'),
  closeDrawer: () => closeDrawers(),
  guideGo: id => {
    const g = GUIDE.find(x => x.id === id); if (!g) return;
    closeDrawers(); closeModal();
    S.coach = id;
    if (S.persona !== g.p) S.persona = g.p;
    const d = DEST[id]; if (d[1]) S.sel = d[1];
    if (id === 'exchange' && !S.gst.installed) S.exch.ctx = true;
    go(d[0]);
  },
  briefDone: () => { markDone('brief'); if (S.coach === 'read') { const c = $('.coach'); if (c) c.outerHTML = coachBar(); } },
  coachOff: () => { S.coach = null; const c = $('.coach'); if (c) c.remove(); },
  welcomeStart: () => { closeModal(); S.coach = 'brief'; renderMain(); },
  how: () => openModal(howModal(), true),
  closeModal: () => { if (!MODAL_LOCK) closeModal(); },
  navOpen: () => { S.navOpen = true; const a = $('#app-root'); if (a) a.classList.add('nav-open'); },
  navClose: () => { S.navOpen = false; const a = $('#app-root'); if (a) a.classList.remove('nav-open'); },
  theme: () => { const nx = currentTheme() === 'dark' ? 'light' : 'dark'; applyTheme(nx); try { localStorage.setItem('autograph-theme', nx); } catch (e) { } },
  reset: () => {
    GEN++; XTOK++;
    S = freshState(); CLOCK = 9 * 60 + 36;
    closeModal(); closeDrawers(); render();
    const m = $('#main'); if (m) m.scrollTop = 0;
    toast('Demo reset.');
  }
};

/* ---------- events and init ---------- */
function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = A[t.getAttribute('data-act')]; if (!f) return;
  e.preventDefault();
  f(t.getAttribute('data-arg'));
}
function onKey(e) {
  if (e.key === 'Escape') {
    const mr = $('#modal');
    if (mr && mr.classList.contains('open')) { if (!MODAL_LOCK) closeModal(); return; }
    if (S.drawer) { closeDrawers(); return; }
    if (S.navOpen) A.navClose();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target) {
    const id = e.target.id;
    if (id === 'ic-in') { e.preventDefault(); A.icSend(); }
    else if (id === 'ask-in') { e.preventDefault(); A.askSend(); }
    else if (id === 'br-in') { e.preventDefault(); A.branchRun(); }
  }
}
function init() {
  try { const t = localStorage.getItem('autograph-theme'); if (t === 'dark' || t === 'light') applyTheme(t); } catch (e) { }
  const root = $('#root'); if (!root) return;
  root.innerHTML = `<div class="app" id="app-root"><aside class="side" id="side" aria-label="Main navigation"></aside><div class="scrim-nav" data-act="navClose"></div><div class="mainwrap"><header class="top" id="top"></header><main class="main" id="main" tabindex="-1"></main></div></div><aside class="drawer" id="ask" aria-label="Ask Autograph"></aside><aside class="drawer" id="guide" aria-label="Demo guide"></aside><div class="modal-root" id="modal"></div><div class="toasts" id="toasts" aria-live="polite"></div>`;
  render();
  openModal(welcomeModal());
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  detectSample();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
